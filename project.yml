name: ClipboardShelf
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ClipboardShelf/Info.plist
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: 526XL62KAS
schemes:
  拾贴测试版:
    build:
      targets:
        ClipboardShelf: all
    run:
      config: Debug
    archive:
      config: Debug
  拾贴上架版:
    build:
      targets:
        ClipboardShelf: all
    run:
      config: AppStore
    archive:
      config: AppStore
targets:
  ClipboardShelf:
    type: application
    platform: macOS
    sources:
      - path: ClipboardShelf
        excludes:
          - Info.plist
          - Entitlements/**
    settings:
      configs:
        Debug:
          CONFIGURATION_BUILD_DIR: "$(PROJECT_DIR)/build"
          PRODUCT_NAME: 拾贴测试版
          PRODUCT_BUNDLE_IDENTIFIER: com.renzhenglin.shitie.dev
          APP_DISPLAY_NAME: 拾贴测试版
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          PRODUCT_NAME: 拾贴测试版
          PRODUCT_BUNDLE_IDENTIFIER: com.renzhenglin.shitie.dev
          APP_DISPLAY_NAME: 拾贴测试版
        AppStore:
          PRODUCT_NAME: 拾贴
          PRODUCT_BUNDLE_IDENTIFIER: com.renzhenglin.shitie
          APP_DISPLAY_NAME: 拾贴
          CODE_SIGN_ENTITLEMENTS: ClipboardShelf/Entitlements/AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
